name: Build and Publish Battleship to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarrega o código do repositório para a máquina virtual do GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java com a versão 21 exigida pelo teu pom.xml
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compila o projeto e gera o JAR usando o Maven (salta os testes)
      - name: Build project with Maven
        run: mvn clean package -DskipTests

      # 4. Faz login automático no Docker Hub usando as tuas credenciais guardadas nos Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Configura o motor do Docker Buildx para suportar builds avançados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Constrói a imagem a partir do teu Dockerfile multi-stage e envia para a cloud
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest