name: Complete CI-CD DevOps Workflow

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: read

jobs:
  devops-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Fazer checkout do código
      - name: 1. Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para o SonarQube ler o histórico de commits

      # Configuração do Ambiente Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 2. Verificar dependências
      - name: 2. Verify Dependencies
        run: mvn dependency:resolve

      # 3. Compilar o projeto
      - name: 3. Compile Project
        run: mvn clean compile

      # 4. Executar os testes unitários
      - name: 4. Run Unit Tests
        run: mvn test

      # 5. Validar a qualidade do código no SonarQube Cloud
      - name: 5. SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          else
            echo "WARNING: SONAR_TOKEN não encontrado nos Secrets. A saltar esta etapa."
          fi

      # Configuração de credenciais para os passos de Docker
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Construir a imagem Docker & 7. Publicar a imagem no Docker Hub
      - name: 6 & 7. Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest

      # 8. Atualizar a documentação no GitHub Pages
      - name: 8. Regenerate and Update Documentation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mvn site
          
          git add docs/
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: atualização automática da documentação via pipeline [skip ci]"
            git push origin main
          else
            echo "Nenhuma alteração detetada na documentação."
          fi