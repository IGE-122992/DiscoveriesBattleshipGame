name: Pipeline Completa de CI/CD - Batalha Naval

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout do código fonte
    - name: Checkout Source Code
      uses: actions/checkout@v3

    # 2. Configuração do Ambiente Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Compilação do Projeto (Maven Compile)
    - name: Compile Project
      run: mvn clean compile

    # 4. Execução de Testes Unitários
    - name: Run Tests
      run: mvn test

    # 5. Verificação de Vulnerabilidades com CodeQL (Segurança)
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: 'java'

    # 6. Análise de Qualidade de Código (SonarQube)
    - name: SonarQube Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn sonar:sonar -Dsonar.projectKey=DiscoveriesBattleshipGame

    # 7. Construção da Imagem Docker (Docker Build)
    - name: Build Docker Image
      run: docker build -t battleship-game:latest .

    # 8. Publicação da Imagem no Docker Hub (Docker Push)
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Push Image to Docker Hub
      run: |
        docker tag battleship-game:latest ${{ secrets.DOCKER_HUB_USERNAME }}/battleship-game:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/battleship-game:latest
